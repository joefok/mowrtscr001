<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where’s the Critter? Colour-Safe Worksheet Maker</title>
<style>
:root{--ink:#1a1a2e;--paper:#fffef8;--acc:#00578a}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#e8ecf2;color:var(--ink);font:15px/1.4 "Atkinson Hyperlegible",Verdana,sans-serif}
:focus-visible{outline:3px solid #000;outline-offset:2px}
.bar{width:min(210mm,100%);margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;font-size:13px}
.bar label{display:flex;flex-direction:column;gap:2px;font-weight:700}
.bar .ck{flex-direction:row;align-items:center;gap:6px}
.tip{flex-basis:100%;font-size:12px}
select,input[type=text]{font:inherit;padding:7px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
input[type=text]{width:9em}
button{font:inherit;font-weight:700;padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--acc);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--ink)}
.page{width:min(210mm,100%);margin:0 auto 14px;padding:7mm;background:var(--paper);border:2px solid var(--ink);border-radius:10px}
h1{margin:0;font-size:clamp(24px,5.2vw,36px);line-height:1.1;text-align:center}
h2{margin:0 0 6px;font-size:22px}
.story{margin:4px 0 6px;text-align:center;font-size:13px}
.meta{display:flex;gap:12px;margin-bottom:6px;font-size:12px}
.meta span{flex:1;border-bottom:2px solid var(--ink)}
.clues{display:flex;gap:6px;margin-bottom:6px}
.clues>*{border:2px solid var(--ink);border-radius:8px;background:#fff}
.hero{width:96px;flex:none;padding:2px}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;font-size:11px;line-height:1.2;text-align:center}
.chip svg,.hero svg{width:100%;height:50px}
.hero svg{height:100%}
.chip small{display:block;font-size:10px}
svg{display:block}
#scene{width:100%;height:auto;border:2px solid var(--ink);border-radius:6px;background:#fff}
.bonus{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:12px}
.box{display:inline-block;width:3em;border-bottom:2px solid var(--ink)}
.ring{display:none}
body.key .ring{display:inline}
#key{display:none;font-size:14px}
body.key #key{display:block}
body.gray .page{filter:grayscale(1)}
@page{size:A4 portrait;margin:7mm}
@media print{
 body{padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bar{display:none}
 .page{width:100%;margin:0;padding:0;border:0;border-radius:0}
 h1{font-size:25pt}.story,.bonus,.meta{font-size:8.5pt}.chip{font-size:7.5pt}.chip small{font-size:6.5pt}
 #key{break-before:page}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div class="bar">
 <label>Scene<select id="scn"><option value="r">Surprise me</option></select></label>
 <label>Difficulty<select id="diff"><option value="easy">Easy (little kids)</option><option value="medium" selected>Medium</option><option value="hard">Hard (very crowded)</option></select></label>
 <label>Puzzle code<input type="text" id="seed" maxlength="20"></label>
 <button type="button" id="nw">New puzzle</button>
 <label class="ck"><input type="checkbox" id="ans">Show answer</label>
 <label class="ck"><input type="checkbox" id="gr">Grayscale check</label>
 <button type="button" id="pr" class="alt">Print / Save PDF</button>
 <span class="tip">Print on A4 portrait with “Background graphics” on. Same puzzle code = same puzzle, so you can reprint it or share the code. “Show answer” adds a second page for the teacher.</span>
</div>

<main class="page" id="page">
 <h1 id="h"></h1>
 <p class="story" id="story"></p>
 <div class="meta"><span>Name:</span><span>Date:</span><span>Time to find it:</span></div>
 <div class="clues" id="clues"></div>
 <svg id="scene" viewBox="0 0 900 860" role="img" aria-labelledby="st">
  <title id="st">Search scene</title>
  <defs>
   <pattern id="st2" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#fff"/><rect width="12" height="10" fill="#c9d6e6"/></pattern>
   <pattern id="dt" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.4" fill="#c9c3b2"/><circle cx="18" cy="19" r="1.4" fill="#c9c3b2"/></pattern>
  </defs>
  <g id="bg"></g><g id="crowd"></g><g class="ring" id="ring"></g>
 </svg>
 <div class="bonus" id="bonus"></div>
</main>

<section class="page" id="key"></section>

<script>
(()=>{
"use strict";
const $=i=>document.getElementById(i),P="#9aa0ad";
const R=(x,y,w,h,f,r=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${P}" stroke-width="2"/>`;
const C=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${P}" stroke-width="2"/>`;
const T=(x,y,t,s=18)=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="middle" fill="#4a5060" font-family="Verdana,sans-serif">${t}</text>`;

/* Animals: [drawn behind body, drawn in front of body]. Fur colour is never a clue. */
const BASE='<ellipse class="c o" cx="0" cy="3" rx="20" ry="15"/><circle class="c o" cx="12" cy="-10" r="13"/><circle class="e" cx="17" cy="-13" r="2"/>';
const PK='#e8a0b4';
const SP={
 Cat:['<path class="o" fill="none" d="M-19 4q-16-4-20-16"/><path class="c o" d="M3-19l-2-13 13 8zM17-21l12-10 1 17z"/>',`<path d="M25-8l-3 4h6z" fill="${PK}"/>`],
 Dog:['<ellipse class="o" fill="#7a6552" cx="1" cy="-10" rx="6" ry="12" transform="rotate(15 1 -10)"/><ellipse class="o" fill="#7a6552" cx="24" cy="-18" rx="5" ry="10" transform="rotate(-20 24 -18)"/>','<ellipse class="o" fill="#fff" cx="23" cy="-3" rx="8" ry="6"/><circle class="e" cx="28" cy="-5" r="2.2"/>'],
 Rabbit:['<ellipse class="c o" cx="5" cy="-30" rx="5" ry="16" transform="rotate(-8 5 -30)"/><ellipse class="c o" cx="20" cy="-30" rx="5" ry="16" transform="rotate(10 20 -30)"/>',`<circle cx="25" cy="-4" r="2.5" fill="${PK}"/>`],
 Bear:['<circle class="c o" cx="2" cy="-22" r="6"/><circle class="c o" cx="22" cy="-22" r="6"/>','<ellipse class="o" fill="#fff" cx="21" cy="-4" rx="7" ry="5.5"/><circle class="e" cx="25" cy="-6" r="2"/>'],
 Pig:['<path class="c o" d="M2-19l-4-13 13 8zM18-21l12-11 1 17z"/>',`<ellipse class="o" fill="${PK}" cx="24" cy="-3" rx="7.5" ry="6"/><circle class="e" cx="22" cy="-4" r="1.2"/><circle class="e" cx="27" cy="-4" r="1.2"/>`],
 Duck:['<path class="c o" d="M-19 3q-13 0-16 10 11-1 21-7z"/>','<path class="o" fill="#E69F00" d="M24-10l15 5-15 6z"/>'],
 Frog:['<circle class="c o" cx="5" cy="-21" r="6"/><circle class="c o" cx="20" cy="-21" r="6"/>','<path class="o" fill="none" d="M14-3q8 6 16-1"/><circle class="e" cx="5" cy="-21" r="2"/><circle class="e" cx="20" cy="-21" r="2"/>'],
 Mouse:[`<circle class="c o" cx="2" cy="-22" r="8"/><circle cx="2" cy="-22" r="4" fill="${PK}"/><circle class="c o" cx="22" cy="-22" r="8"/><circle cx="22" cy="-22" r="4" fill="${PK}"/><path class="o" fill="none" d="M-19 6q-14 6-20-4"/>`,`<circle cx="26" cy="-5" r="2.5" fill="${PK}"/>`]
};

/* Clues differ by SHAPE and PATTERN, not hue. Same three colours are reused on every decoy. */
const HAT=['<path class="o" fill="#0072B2" d="M3-21L12-43 21-21z"/><path d="M6-28h12M8.5-35h7" stroke="#fff" stroke-width="2.4" fill="none"/><circle class="o" fill="#fff" cx="12" cy="-44" r="4.5"/>',
 '<path class="o" fill="#0072B2" d="M-1-20q13-15 26 0z"/><path class="o" fill="#0072B2" d="M20-21h13v5H20z"/>',
 '<path class="o" fill="#0072B2" d="M2-20v-20h20v20z"/><path class="o" fill="#fff" d="M2-24h20v4H2z"/><path class="o" fill="#0072B2" d="M-3-20h30v4H-3z"/>'];
const SB='<path class="o" fill="#D55E00" d="M-4 6q14 9 30-2l-2 8q-14 9-27 1z"/><path class="o" fill="#D55E00" d="M8 12l8 12-7 2-7-12z"/>';
const SCF=[SB+'<path d="M3 9.5v5M11 10.5v5.5M19 8.5v5" stroke="#fff" stroke-width="2.4"/>',SB,
 SB+'<circle cx="3" cy="12" r="1.8" fill="#fff"/><circle cx="11" cy="13.5" r="1.8" fill="#fff"/><circle cx="19" cy="11" r="1.8" fill="#fff"/>'];
const PB='<rect class="o" fill="#F0E442" x="-24" y="0" width="16" height="17" rx="3"/>';
const PAK=[PB+'<path fill="#1a1a2e" d="M-16 3.5l1.6 3.6 3.8.3-2.9 2.5.9 3.8-3.4-2-3.4 2 .9-3.8-2.9-2.5 3.8-.3z"/>',
 PB+'<path d="M-24 5h16" stroke="#1a1a2e" stroke-width="1.6"/>',PB+'<circle cx="-16" cy="8.5" r="3.5" fill="#1a1a2e"/>'];
const HN=['pointy hat with a pom-pom','flat cap','top hat'],SN=['striped scarf','plain scarf','dotted scarf'],KN=['star backpack','plain backpack','dot-badge backpack'];
const COATS=['#f2e6c9','#e0a458','#9fd0ee','#e8a9c9','#a6d9b8','#d0d0d0','#9b8573','#f0e442'];
const NM=['Biscuit','Waffles','Noodle','Pickles','Mochi','Sprout','Crumbs','Fudge','Banjo','Turnip','Pudding','Zigzag'];
const RS=['chasing a runaway pancake','late for a very important nap','hiding from a sneeze','practising for the Big Pie Contest','pretending to be a statue','searching for the world’s best snack','trying to look casual'];
const QUEST=['Circle the animal who looks the sleepiest.','Find an animal that looks suspiciously happy.','Draw sunglasses on your favourite animal.','Find two animals who could be twins.','Which animal looks most like it forgot something?'];
const pl=s=>s==="Mouse"?"Mice":s+"s";

let d="";
for(const k in SP)d+=`<g id="${k}">${SP[k][0]}${BASE}${SP[k][1]}</g>`;
HAT.forEach((s,i)=>d+=`<g id="h${i}">${s}</g>`);
SCF.forEach((s,i)=>d+=`<g id="s${i}">${s}</g>`);
PAK.forEach((s,i)=>d+=`<g id="p${i}">${s}</g>`);
$("defs").innerHTML=d;
const st=document.createElement("style");
st.textContent=".o{stroke:#1a1a2e;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.c{fill:var(--c)}.e{fill:#1a1a2e}";
document.head.appendChild(st);

/* Scenes: pale, low-contrast scenery with light-grey lines so the dark-outlined animals stand out. */
const SC=[
{n:"farmers’ market",sky:"#f6f1e6",fl:"#ebe3d0",d:()=>{let s=T(450,38,"FRESH HATS DAILY",22);for(let i=0;i<4;i++){const x=14+i*222;s+=R(x,60,196,38,"url(#st2)")+R(x+10,98,176,120,"#fff");["#f5d9a8","#cfe3c3","#f1c9d6"].forEach((f,j)=>s+=C(x+40+j*58,190,14,f))}return s}},
{n:"town park",sky:"#e6f1f7",fl:"#e3efd9",d:()=>{let s=T(450,34,"DUCKS HAVE RIGHT OF WAY",20);[[110,170,1],[450,150,.8],[790,175,1.1]].forEach(([x,y,k])=>s+=R(x-8*k,y,16*k,60*k,"#e3cfb3")+C(x,y-5*k,48*k,"#cfe3c3"));return s+`<ellipse cx="640" cy="205" rx="90" ry="22" fill="#d3e7f2" stroke="${P}" stroke-width="2"/>`}},
{n:"seaside",sky:"#f3f8fa",fl:"#f3e8cf",d:()=>{let s=`<rect y="50" width="900" height="110" fill="#d6e9f2"/><path d="M0 105q30-14 60 0${"t60 0".repeat(14)}" fill="none" stroke="#a9cbe0" stroke-width="3"/>`+C(780,30,40,"#fbe9a8")+T(450,38,"NO SHARKS (PROBABLY)",20);[150,430,720].forEach(x=>s+=`<path d="M${x-60} 215q60-80 120 0z" fill="url(#st2)" stroke="${P}" stroke-width="2"/><path d="M${x} 180v50" stroke="${P}" stroke-width="3"/>`);return s}},
{n:"train station",sky:"#ecebf2",fl:"#e4e1d8",d:()=>R(250,40,400,60,"#d5d8e8",6)+T(450,82,"PLATFORM 7",32)+C(450,160,34,"#fff")+`<path d="M450 160v-22M450 160l16 8" stroke="#4a5060" stroke-width="4"/>`+R(60,40,34,200,"#d8d8e6")+R(806,40,34,200,"#d8d8e6")+T(450,226,"TRAIN LATE (AGAIN)",16)}
];

function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

function build(){
 const code=$("seed").value.trim()||"critter";
 try{history.replaceState(null,"","#"+encodeURIComponent(code))}catch(e){}
 let a=hash(code);
 const rnd=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const ri=n=>Math.floor(rnd()*n),pick=l=>l[ri(l.length)];
 const diff=$("diff").value,N={easy:90,medium:220,hard:400}[diff],same={easy:3,medium:6,hard:10}[diff];
 const sc=$("scn").value==="r"?pick(SC):SC[+$("scn").value];
 const names=Object.keys(SP),tsp=pick(names),name=pick(NM),reason=pick(RS),coat=pick(COATS);

 const X0=30,X1=870,Y0=262,Y1=840;
 const cols=Math.round(Math.sqrt(N*(X1-X0)/(Y1-Y0))),rows=Math.ceil(N/cols),cw=(X1-X0)/cols,ch=(Y1-Y0)/rows;
 const z0=Math.max(.6,Math.min(1.5,Math.min(cw,ch*1.15)/50));
 const pts=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)pts.push([X0+cw*(c+.5)+(rnd()-.5)*cw*.5,Y0+ch*(r+.8)+(rnd()-.5)*ch*.35]);
 for(let i=pts.length-1;i>0;i--){const j=ri(i+1);[pts[i],pts[j]]=[pts[j],pts[i]]}

 /* v = [hat, scarf, pack]; 0 = the target's clue, 1/2 = look-alike, -1 = none */
 const near=()=>{const v=[0,0,0];v[ri(3)]=pick([-1,1,2]);return v};
 const others=names.filter(n=>n!==tsp);
 const items=pts.map((p,i)=>{
  const sp=i<=same?tsp:pick(others);
  let v;
  if(i===0)v=[0,0,0];
  else if(i<=same||rnd()<.06)v=near();
  else{v=[0,0,0].map(()=>rnd()<.2?ri(3):-1);if(v.every(x=>x===0))v[2]=1}
  return{sp,v,x:p[0],y:p[1],z:z0*(.92+rnd()*.16),f:rnd()<.5?-1:1,c:i===0?coat:pick(COATS)};
 });
 const tg=items[0],rest=items.slice(1).sort((m,n)=>m.y-n.y);
 const draw=o=>`<g transform="translate(${o.x.toFixed(1)} ${o.y.toFixed(1)}) scale(${(o.z*o.f).toFixed(3)} ${o.z.toFixed(3)})" style="--c:${o.c}"><use href="#${o.sp}"/>${[["p",2],["s",1],["h",0]].map(([k,i])=>o.v[i]>=0?`<use href="#${k}${o.v[i]}"/>`:"").join("")}</g>`;

 $("bg").innerHTML=`<rect width="900" height="860" fill="${sc.sky}"/><rect y="240" width="900" height="620" fill="${sc.fl}"/><rect y="240" width="900" height="620" fill="url(#dt)"/><path d="M0 240H900" stroke="${P}" stroke-width="2"/>`+sc.d();
 $("crowd").innerHTML=rest.map(draw).join("")+draw(tg);
 const rx=tg.x.toFixed(1),ry=(tg.y-8*tg.z).toFixed(1),rr=(32*tg.z+8).toFixed(1);
 $("ring").innerHTML=`<circle cx="${rx}" cy="${ry}" r="${rr}" fill="none" stroke="#fff" stroke-width="9"/><circle cx="${rx}" cy="${ry}" r="${rr}" fill="none" stroke="#1a1a2e" stroke-width="4" stroke-dasharray="9 5"/>`;

 $("h").textContent=`Where’s ${name} the ${tsp}?`;
 $("story").textContent=`${name} is ${reason} at the ${sc.n}. Find the one ${tsp.toLowerCase()} wearing the full outfit. Fur colours change, so only shapes and patterns count!`;
 $("st").textContent=`Find ${name} the ${tsp} at the ${sc.n}`;

 const chip=(vb,id,t,n)=>`<div class="chip"><svg viewBox="${vb}" role="img" aria-label="${t}"><use href="#${id}"/></svg><b>${t}</b><small>${n}</small></div>`;
 $("clues").innerHTML=`<div class="hero"><svg viewBox="-48 -55 104 90" role="img" aria-label="${name} the ${tsp} wearing the full outfit"><g style="--c:${coat}"><use href="#${tsp}"/><use href="#p0"/><use href="#s0"/><use href="#h0"/></g></svg></div>`
  +chip("-6 -50 36 32","h0","Pointy hat + pom-pom","not a flat cap or top hat")
  +chip("-8 2 38 28","s0","Striped scarf","not plain or dotted")
  +chip("-30 -3 28 24","p0","Star backpack","not plain or dot-badge");

 /* Counting questions, with answers computed from the picture itself */
 const cnt=f=>items.filter(f).length;
 const k1=ri(3),k2=ri(3),useScarf=rnd()<.5,sp2=pick(names);
 const Qs=[
  {t:`How many animals wear a ${HN[k1]}?`,n:cnt(o=>o.v[0]===k1)},
  useScarf?{t:`How many animals wear a ${SN[k2]}?`,n:cnt(o=>o.v[1]===k2)}:{t:`How many animals carry a ${KN[k2]}?`,n:cnt(o=>o.v[2]===k2)},
  {t:`How many ${pl(sp2)} are hiding here?`,n:cnt(o=>o.sp===sp2)}
 ];
 $("bonus").innerHTML=Qs.map(q=>`<span>${q.t} <i class="box"></i></span>`).join("")+`<span><b>Side quest:</b> ${pick(QUEST)}</span>`;

 const tx=tg.x/900,ty=(tg.y-Y0)/(Y1-Y0);
 const vert=ty<.33?"top":ty>.66?"bottom":"middle",hor=tx<.33?"left":tx>.66?"right":"middle";
 const where=vert==="middle"&&hor==="middle"?"the centre":`the ${vert} ${hor}`;
 $("key").innerHTML=`<h2>Teacher key: ${name} the ${tsp}</h2><p>${name} is in <b>${where}</b> of the picture (ringed on page 1). The full outfit is a pointy hat with a pom-pom, a striped scarf and a star backpack. There are ${items.length} animals in total.</p><ol>${Qs.map(q=>`<li>${q.t} <b>${q.n}</b></li>`).join("")}</ol><p>Colour-safe design: clues are told apart by shape and pattern only, and the same three accent colours appear on every decoy. Use “Grayscale check” to prove it.</p>`;
}

SC.forEach((s,i)=>$("scn").add(new Option(s.n.charAt(0).toUpperCase()+s.n.slice(1),i)));
const fresh=()=>{$("seed").value=Math.random().toString(36).slice(2,8);build()};
$("scn").onchange=$("diff").onchange=$("seed").onchange=build;
$("nw").onclick=fresh;
$("pr").onclick=()=>window.print();
$("ans").onchange=e=>document.body.classList.toggle("key",e.target.checked);
$("gr").onchange=e=>document.body.classList.toggle("gray",e.target.checked);
const h=decodeURIComponent(location.hash.slice(1));
if(h){$("seed").value=h;build()}else fresh();
})();
</script>
</body>
</html>
